# Extension identities allowed to start the WAN Download Manager native host.
# Chrome/Edge: the 32-character extension id. Firefox: the add-on id from manifest.json (browser_specific_settings.gecko.id).
# Store ids are assigned when the extensions are published — add them here and in native-messaging/manifests/*.json.
# Development: load the unpacked extension, copy its id from chrome://extensions or edge://extensions.
chrome=
edge=
firefox=download-manager@wan.example
